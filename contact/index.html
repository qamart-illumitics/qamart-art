<body>
  <header class="site-header">
    <a class="site-title" href=".././">Qamar Tahasildar Art</a>
    <a class="icon-link" href="https://www.instagram.com/qamart.art/" aria-label="Instagram" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
  </header>
  <main class="contact">
    <h1>Contact me.</h1>
    <div>
      <form class="form" action="https://formspree.io/f/xjygjlkg" method="POST">
        <fieldset>
          <legend>Name</legend>
          <div class="row">
            <div class="field">
              <label for="first-name">First Name <span>(required)</span></label>
              <input id="first-name" name="firstName" type="text" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="last-name">Last Name <span>(required)</span></label>
              <input id="last-name" name="lastName" type="text" autocomplete="family-name" required>
            </div>
          </div>
        </fieldset>
        <div class="field">
          <label for="email">Email <span>(required)</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message <span>(required)</span></label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <input type="hidden" name="_subject" value="New message from qamart.art">
        <p class="form-error" role="alert" hidden></p>
        <button class="button" type="submit">Send</button>
      </form>
      <p class="form-thanks" role="status" tabindex="-1" hidden>Thanks — I'll be in touch soon.</p>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Qamar Tahasildar Art</span>
    <a href="https://www.instagram.com/qamart.art/" rel="noopener">Instagram</a>
  </footer>
